<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}WaySmart | Unimos Caminos, Optimizamos Destinos{% endblock %}</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark d-flex flex-column min-vh-100">

<!-- Navbar limpia y moderna -->
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-3">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 text-primary d-flex align-items-center gap-2" href="/">
            <i class="bi bi-geo-alt-fill"></i> WaySmart
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto gap-lg-3">
                <li class="nav-item"><a class="nav-link fw-medium" href="#como-funciona">¿Cómo funciona?</a></li>
                <li class="nav-item"><a class="nav-link fw-medium" href="#roles">Roles</a></li>
                <li class="nav-item"><a class="nav-link fw-medium" href="#tecnologia">Tecnología IA</a></li>
            </ul>
            <div class="d-flex gap-2 mt-3 mt-lg-0">
                <a href="/login/" class="btn btn-outline-dark fw-semibold px-3">Iniciar sesión</a>
                <a href="/registro/" class="btn btn-primary fw-semibold px-3">Registrarse</a>
            </div>
        </div>
    </div>
</nav>

<!-- Aquí se carga cada página -->
<main class="flex-grow-1">
    {% block content %}{% endblock %}
</main>

<!-- Footer completo -->
<footer class="bg-dark text-white py-4 mt-auto">
    <div class="container">
        <div class="row align-items-center gy-3">
            <div class="col-md-6 text-center text-md-start">
                <span class="fw-bold fs-5 text-primary"><i class="bi bi-geo-alt-fill"></i> WaySmart</span>
                <p class="text-white-50 small mb-0 mt-1">Unimos Caminos, Optimizamos Destinos.</p>
            </div>
            <div class="col-md-6 text-center text-md-end text-white-50 small">
                <p class="mb-0">&copy; 2026 WaySmart · Todos los derechos reservados.</p>
                <p class="mb-0">Fábrica de Software CTPI — SENA Regional Cauca</p>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
