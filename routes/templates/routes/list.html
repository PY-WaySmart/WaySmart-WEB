{% extends "base.html" %}
{% block title %}Rutas | WaySmart{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="ws-card p-4">
        <h1 class="ws-hero-title h2 mb-4">Rutas</h1>
        <table class="table ws-table align-middle">
            {% for ruta in object_list %}
            <tr><td>{{ ruta }} — {{ ruta.tipo_ruta }}</td></tr>
            {% empty %}
            <tr><td>No hay rutas registradas.</td></tr>
            {% endfor %}
        </table>
    </div>
</div>
{% endblock %}
