{% extends "base.html" %}
{% block title %}Empresas | WaySmart{% endblock %}
{% block content %}
<h1>Empresas</h1>
<ul class="list-group">
    {% for empresa in object_list %}
    <li class="list-group-item">{{ empresa.nombre }} — {{ empresa.get_estado_display }}</li>
    {% empty %}
    <li class="list-group-item">No hay empresas registradas.</li>
    {% endfor %}
</ul>
{% endblock %}
