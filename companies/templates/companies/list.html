{% extends "base.html" %}
{% block title %}Empresas | WaySmart{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="ws-card p-4">
        <h1 class="ws-hero-title h2 mb-4">Empresas</h1>
        <table class="table ws-table align-middle">
            {% for empresa in object_list %}
            <tr><td>{{ empresa.nombre }} — {{ empresa.get_estado_display }}</td></tr>
            {% empty %}
            <tr><td>No hay empresas registradas.</td></tr>
            {% endfor %}
        </table>
    </div>
</div>
{% endblock %}
