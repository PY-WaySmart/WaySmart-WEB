{% extends "base.html" %}
{% block title %}Recuperar contraseña | WaySmart{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="ws-card auth-card">
        <div class="text-center mb-4">
            <div class="text-info fs-2 mb-2"><i class="bi bi-shield-lock-fill"></i></div>
            <h1 class="ws-hero-title h3 mb-2">Recupera tu contraseña</h1>
            <p class="text-secondary small">Ingresa tu correo y te enviaremos un enlace seguro.</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <label for="{{ form.email.id_for_label }}" class="form-label">Correo electrónico</label>
            {{ form.email }}
            {{ form.email.errors }}
            <button type="submit" class="btn btn-ws-pill-solid w-100 mt-4">Enviar enlace</button>
        </form>
        <p class="text-center mt-4 mb-0 small">
            <a class="auth-link" href="{% url 'users:login' %}">Volver a iniciar sesión</a>
        </p>
    </div>
</div>
{% endblock %}
