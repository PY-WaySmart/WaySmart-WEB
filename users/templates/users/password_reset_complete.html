{% extends "base.html" %}
{% block title %}Contraseña actualizada | WaySmart{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="ws-card auth-card text-center">
        <div class="text-success fs-1 mb-3"><i class="bi bi-check-circle-fill"></i></div>
        <h1 class="ws-hero-title h3">Contraseña actualizada</h1>

    </div>
</div>
{% endblock %}
