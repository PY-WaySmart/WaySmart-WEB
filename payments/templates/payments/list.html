{% extends "base.html" %}
{% block title %}Pagos | WaySmart{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="ws-card p-4">
        <h1 class="ws-hero-title h2 mb-4">Pagos a repartidores</h1>
        <table class="table ws-table align-middle">
            {% for pago in object_list %}
            <tr><td>{{ pago.repartidor }} — {{ pago.monto_neto }} ({{ pago.get_estado_display }})</td></tr>
            {% empty %}
            <tr><td>No hay pagos registrados.</td></tr>
            {% endfor %}
        </table>
    </div>
</div>
{% endblock %}
