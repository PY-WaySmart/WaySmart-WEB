{% extends "base.html" %}
{% block title %}Servicios | WaySmart{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="ws-card p-4">
        <h1 class="ws-hero-title h2 mb-4">Servicios</h1>
        <table class="table ws-table align-middle">
            {% for servicio in object_list %}
            <tr><td>{{ servicio.codigo_servicio }} — {{ servicio.get_estado_display }}</td></tr>
            {% empty %}
            <tr><td>No hay servicios registrados.</td></tr>
            {% endfor %}
        </table>
    </div>
</div>
{% endblock %}
